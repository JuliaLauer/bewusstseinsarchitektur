<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Bestätigt · Bewusstseinsarchitektur</title>
  <meta name="description" content="Deine Anmeldung ist bestätigt. Der Brief ist gerade in deinem Postfach angekommen." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://bewusstseinsarchitektur.de/bestandsaufnahme-danke" />
  <link href="/fonts/fonts.css" rel="stylesheet" />

  <style>
    :root {
      --bordeaux: #3D1219;
      --terrakotta: #c95e46;
      --licht: #FAF8F5;
      --weiss: #FFFFFF;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Jost', system-ui, sans-serif;
      --container-px: clamp(1.5rem, 5vw, 4rem);
      --transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font-body);
      font-weight: 400;
      color: var(--weiss);
      background: var(--bordeaux);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* NOISE OVERLAY */
    .noise { position: relative; }
    .noise::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 1;
    }

    /* LAYOUT */
    .danke-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--container-px);
      position: relative;
    }

    .danke-inner {
      max-width: 540px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* LOT */
    .danke-lot {
      width: 44px;
      height: 50px;
      display: block;
      margin: 0 auto 3rem auto;
      opacity: 0;
      animation: fadeIn 1.4s ease-out 0.2s forwards;
    }

    /* HEADLINE & TEXT */
    .danke-label {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 0.75rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      display: block;
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: fadeIn 1.4s ease-out 0.4s forwards;
    }

    .danke-headline {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(2.6rem, 6vw, 4rem);
      line-height: 1.15;
      color: var(--weiss);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeIn 1.4s ease-out 0.6s forwards;
    }

    .danke-text {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1.05rem;
      line-height: 1.85;
      color: rgba(255,255,255,0.88);
      margin-bottom: 0.6rem;
      opacity: 0;
      animation: fadeIn 1.4s ease-out 0.85s forwards;
    }

    .danke-text-soft {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.92rem;
      line-height: 1.8;
      color: rgba(255,255,255,0.55);
      max-width: 38ch;
      margin: 0 auto;
      opacity: 0;
      animation: fadeIn 1.4s ease-out 1.05s forwards;
    }

    /* ANIMATION */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* MOBILE */
    @media (max-width: 480px) {
      .danke-lot { width: 36px; height: 40px; margin-bottom: 2.25rem; }
      .danke-label { font-size: 0.68rem; margin-bottom: 1.5rem; }
      .danke-headline { font-size: clamp(2.2rem, 9vw, 3rem); margin-bottom: 2rem; }
      .danke-text { font-size: 1rem; }
      .danke-text-soft { font-size: 0.88rem; margin-bottom: 0; }
    }
  </style>
</head>
<body>

  <main class="danke-page noise">
    <div class="danke-inner">

      <svg class="danke-lot" viewBox="0 0 180 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="30" y1="60" x2="150" y2="60" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/>
        <line x1="105" y1="60" x2="105" y2="140" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" opacity="0.7"/>
        <circle cx="105" cy="148" r="4.5" fill="#c95e46"/>
      </svg>

      <span class="danke-label">Bestätigt</span>

      <h1 class="danke-headline">
        Der Brief ist unterwegs.
      </h1>

      <p class="danke-text-soft">
        In den nächsten Minuten in deinem Postfach.
        Falls nicht, schau im Spam-Ordner nach.
      </p>

    </div>
  </main>

</body>
</html>
