<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&display=swap');
      .marke-text {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: 32px;
        fill: #2e0f14;
      }
    </style>
  </defs>
  <!-- Lot Symbol zentriert oben -->
  <g transform="translate(110, 40)">
    <line x1="30" y1="60" x2="150" y2="60" stroke="#2e0f14" stroke-width="2.4" stroke-linecap="square"/>
    <line x1="105" y1="60" x2="105" y2="140" stroke="#2e0f14" stroke-width="1.6" stroke-linecap="square" opacity="0.7"/>
    <circle cx="105" cy="148" r="4.5" fill="#c95e46"/>
  </g>
  <!-- Text zentriert darunter -->
  <text x="200" y="265" text-anchor="middle" class="marke-text">Bewusstseinsarchitektur</text>
</svg>
